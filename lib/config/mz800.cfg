#
# Target configuration file for z88dk
#

INCLUDE tools.inc

# Asm file which contains the startup code (without suffix)
CRT0		 DESTDIR/lib/target/mz800/classic/mz800_crt0

# Any default options you want - these are options to zcc which are fed
# through to compiler, assembler etc as necessary
OPTIONS		 -O2 -SO2 -iquote. -D__Z80__ -D__Z80 -DMZ800 -D__MZ800__ -subtype=default -clib=default

CLIB		default -Cc-standard-escape-chars -lmz800_clib -lndos -LDESTDIR/lib/clibs/z80

SUBTYPE     none
# default: a boot disc (.d88) started by the IPL, linked at $1200 where the IPL reads it
SUBTYPE		default -startup=1 -Cz+mz800

INCLUDE alias.inc
