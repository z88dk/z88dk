#
# Target configuration file for z88dk
#

INCLUDE tools.inc

# Asm file which contains the startup code (without suffix)
CRT0		 DESTDIR/lib/target/spc1500/classic/spc1500_crt0

# Any default options you want - these are options to zcc which are fed
# through to compiler, assembler etc as necessary
OPTIONS		 -O2 -SO2 -iquote. -D__Z80__ -D__Z80 -D__SPC1500__ -subtype=default -clib=default

CLIB		default -lspc1500_clib -lndos -Cc-standard-escape-chars -LDESTDIR/lib/clibs/z80

SUBTYPE     none
# default: a cassette (.tap for MAME, .wav) for the IPL's "C: cassette system",
# the program packed with ZX0 and unpacked at $0000
SUBTYPE		default -Cz+spc1500

INCLUDE alias.inc
