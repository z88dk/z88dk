#
# Target configuration file for z88dk
#

INCLUDE tools.inc

# Asm file which contains the startup code (without suffix)
CRT0		 DESTDIR/lib/target/pc8001/classic/pc8001_crt0

# Any default options you want - these are options to zcc which are fed
# through to compiler, assembler etc as necessary
OPTIONS		 -O2 -SO2 -iquote. -D__Z80__ -D__Z80 -DPC8001 -D__PC8001__ -Cc-standard-escape-chars -clib=default -subtype=default

CLIB		default -lpc8001_clib -lndos -LDESTDIR/lib/clibs/z80
# PC-8001mkII with hires graphics. The GVRAM is paged in at $8000-$BFFF, so the
# program is allram: it runs from $0000, below that. The tape has a bootstrap
CLIB		mk2  -lpc8001_clib -lndos -D__PC8001MK2__ -pragma-define:CLIB_PC8001_HIRES=1 -pragma-define:PC8001_ALLRAM=1 -LDESTDIR/lib/clibs/z80
CLIB		ansi  -pragma-need=ansiterminal -D__CONIO_VT100 -lpc8001_clib -lndos -pragma-define:CLIB_ANSITERMINAL_BRIDGE=1 -LDESTDIR/lib/clibs/z80

# RAM is 0x8000-0xffff (32k) or 0xc000-0xffff (16k)
SUBTYPE		default -Cz+pc88
SUBTYPE		32k -Cz+pc88
SUBTYPE		16k -Cz+pc88 -pragma-define:PC8001_SUBTYPE_16K=1
# PC-8001mkII with the ROM switched out: the program runs from $0000. The tape has
# a bootstrap first, which loads it over the ROM
SUBTYPE		allram -Cz+pc88 -pragma-define:PC8001_ALLRAM=1

INCLUDE alias.inc
