#
# Target configuration file for z88dk
#

INCLUDE tools.inc

# Asm file which contains the startup code (without suffix)
CRT0		 DESTDIR/lib/target/pc6001/classic/pc6001_crt0

# Any default options you want - these are options to zcc which are fed
# through to compiler, assembler etc as necessary
OPTIONS		 -O2 -SO2 -iquote. -D__Z80__ -D__Z80 -DPC6001 -D__PC6001__ -subtype=default -Cc-standard-escape-chars -clib=default

CLIB		default -lpc6001_clib -lndos -LDESTDIR/lib/clibs/z80
CLIB		ansi  -pragma-need=ansiterminal -D__CONIO_VT100 -lpc6001_clib -lndos -LDESTDIR/lib/clibs/z80
# mk2: the PC-6001mkII's library (320x200 console and graphics, disc, overlays), for any subtype: -subtype=mk2disc has it, and a cartridge is -subtype=rom -clib=mk2 (the crt then keeps its variables in the RAM below the screen)
CLIB		mk2 -pragma-define:CRT_PC6001MK2=1 -lpc6001mk2 -lpc6001_clib -lndos -LDESTDIR/lib/clibs/z80

SUBTYPE     none 
SUBTYPE		default -Cz+nec -startup=1
SUBTYPE		16k -Cz+nec -startup=1
SUBTYPE		32k -startup=2 -Cz+nec
SUBTYPE		n60m -startup=3 -Cz+nec
SUBTYPE     rom  -startup=4 -Cz+rom -Cz--rombase -Cz16384 -D__ROM__
# mk2disc: a boot disc for the PC-6001mkII (all RAM, the program at $0000 from the disc by its own boot sector: lib/target/pc6001/classic/bootstrap_mk2.asm), made by appmake +pc6001mk2
SUBTYPE     mk2disc -startup=5 -Cz+pc6001mk2 -D__MK2DISC__ -clib=mk2

INCLUDE alias.inc
