name: build-mingw-on-ubuntu

on:
  push:
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'doc/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout from git
      uses: actions/checkout@v5
      with: 
        submodules: 'true'
    # Keyed per workflow: restore-keys is a prefix match, so a shared
    # "Linux-ccache-" prefix would let this job restore the native build's
    # cache and vice versa.
    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: |
          ~/.ccache
        key: ${{ runner.os }}-ccache-mingw-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-ccache-mingw-
    - name: Update apt
      run: |
        sudo apt-get update -y
    - name: Install apt dependencies
      run: |
        sudo apt-get install -y ccache gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 dos2unix ragel re2c
    # The build exports CC/CXX as single words, so ccache has to come in via
    # the /usr/lib/ccache symlinks rather than a "ccache gcc" prefix -- see
    # src/z80asm/tools/build_ldflags.pl, which takes exactly two arguments.
    # The symlinks for the cross compilers only exist once those packages are
    # installed, hence running this after apt rather than before.
    - name: Configure ccache
      run: |
        sudo /usr/sbin/update-ccache-symlinks || true
        for c in x86_64-w64-mingw32-gcc x86_64-w64-mingw32-g++; do
          [ -e /usr/lib/ccache/$c ] || sudo ln -sf /usr/bin/ccache /usr/lib/ccache/$c
        done
        ls -l /usr/lib/ccache/ | grep mingw
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=300M" >> $GITHUB_ENV
        # Compile the original source on a miss, not the preprocessed output.
        # ccache 3.x (what cygwin ships) defaults the other way, and the
        # preprocessor strips the "// fall through" comments that
        # -Wimplicit-fallthrough reads -- with -Werror that is a hard failure.
        # Default in 4.x; set everywhere so the behaviour does not depend on
        # which ccache a platform happens to package.
        echo "CCACHE_CPP2=1" >> $GITHUB_ENV
        echo "/usr/lib/ccache" >> $GITHUB_PATH
    - name: Install libxml2
      run: |
        set -ex
        wget http://xmlsoft.org/sources/win32/64bit/libxml2-2.9.1-win32-x86_64.7z
        ( mkdir libxml2-2.9.1-win32-x86_64 && cd libxml2-2.9.1-win32-x86_64 && 7z x ../libxml2-2.9.1-win32-x86_64.7z && sudo rsync -avhH . /usr/x86_64-w64-mingw32 )
        sudo chmod +x /usr/x86_64-w64-mingw32/bin/xml2-config
    - name: Install libiconv
      run: |
        set -ex
        wget https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-libiconv-1.17-4-any.pkg.tar.zst
        zstd -d mingw-w64-x86_64-libiconv-1.17-4-any.pkg.tar.zst
        ( mkdir mingw-w64-x86_64-libiconv-1.17-4-any && cd mingw-w64-x86_64-libiconv-1.17-4-any && tar xvf ../mingw-w64-x86_64-libiconv-1.17-4-any.pkg.tar && cd mingw64 && rsync -avhH . /usr/x86_64-w64-mingw32 )
    - name: Install zlib
      run: |
        set -ex
        wget https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-zlib-1.3.1-1-any.pkg.tar.zst
        zstd -d mingw-w64-x86_64-zlib-1.3.1-1-any.pkg.tar.zst
        ( mkdir mingw-w64-x86_64-zlib-1.3.1-1-any && cd mingw-w64-x86_64-zlib-1.3.1-1-any && tar xvf ../mingw-w64-x86_64-zlib-1.3.1-1-any.pkg.tar && cd mingw64 && rsync -avhH . /usr/x86_64-w64-mingw32 )
    - name: Install GMP
      run: |
        set -ex
        wget https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-gmp-6.3.0-2-any.pkg.tar.zst
        zstd -d mingw-w64-x86_64-gmp-6.3.0-2-any.pkg.tar.zst
        ( mkdir mingw-w64-x86_64-gmp-6.3.0-2-any && cd mingw-w64-x86_64-gmp-6.3.0-2-any && tar xvf ../mingw-w64-x86_64-gmp-6.3.0-2-any.pkg.tar && cd mingw64 && rsync -avhH . /usr/x86_64-w64-mingw32 )
    - name: Build binaries
      run: |
        set -ex
        export CFLAGS="-g -O2"
        export CC="x86_64-w64-mingw32-gcc"
        export CXX="x86_64-w64-mingw32-g++"
        export PREFIX="c:/z88dk/"
        export CROSS=1
        export EXESUFFIX=".exe"
        export PKG_CONFIG_PATH=/usr/x86_64-w64-mingw32/lib/pkgconfig/
        export XML2CONFIG="/usr/x86_64-w64-mingw32/bin/xml2-config --prefix=/usr/x86_64-w64-mingw32"
        make
    # Hit rate is the only way to tell the cache is working.
    - name: ccache stats
      if: always()
      run: ccache -s
