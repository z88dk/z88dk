name: build-on-windows-msys2
on:
  push:
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      LANG: C
      LC_ALL: C
    steps:
    - name: Configure git
      run: |
        git config --global core.autocrlf input
      shell: cmd
    - name: Checkout from git
      uses: actions/checkout@v5
      with:
        submodules: 'true'
    # A library build is ~200k short-lived processes, and Defender scans every
    # exec and every object written. Excluding the trees it touches attacks the
    # per-spawn cost, which is what the Windows builds are bound by.
    - name: Exclude build trees from Defender
      shell: powershell
      run: |
        foreach ($p in "${{ github.workspace }}", "C:\msys64", "C:\ccache") {
          Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue
        }
    # C:\ccache rather than ~/.ccache: actions/cache resolves ~ through node,
    # to C:\Users\runneradmin, which is not where the msys2 shell's ~ points.
    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: |
          C:\ccache
        key: ${{ runner.os }}-ccache-msys2-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-ccache-msys2-
    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        # The image already ships MSYS2; a fresh install just puts a second
        # copy on disk and costs the time to download it.
        release: false
        install: >
            base-devel
            git
            m4
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-make
            mingw-w64-x86_64-perl
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-ragel
            re2c
            vim
    - name: Install Strawberry Perl
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54201_64bit/strawberry-perl-5.42.0.1-64bit.msi" -OutFile "strawberry.msi"
        Start-Process msiexec.exe -ArgumentList "/i strawberry.msi /quiet /qn /norestart" -Wait
    - name: Install CPAN modules (Strawberry Perl)
      shell: cmd
      run: |
        set PATH=C:\Strawberry\perl\bin;C:\Strawberry\c\bin;%PATH%
        cpanm --notest Archive::Zip Array::Compare CPU::Z80::Assembler Capture::Tiny Clone Data::Dump Data::HexDump File::Path List::Uniq Modern::Perl Object::Tiny Object::Tiny::RW Params::Util Path::Tiny Preproc::Tiny Regexp::Common Spreadsheet::ParseXLSX Test::Harness Test::HexDifferences Test::PureASCII Text::Diff Text::Table Win32::Autoglob YAML::Tiny
    - name: Bootstrap cpanm for MinGW Perl
      shell: msys2 {0}
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin
        curl -L https://raw.githubusercontent.com/miyagawa/cpanminus/master/cpanm -o /mingw64/bin/cpanm
        chmod +x /mingw64/bin/cpanm
        which cpanm
        cpanm --version
    - name: Install XS modules under MinGW Perl
      shell: msys2 {0}
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin
        cpanm --notest Params::Util
    - name: Configure PERL5LIB for MinGW Perl
      shell: msys2 {0}
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin:/c/Strawberry/perl/bin
        export PERL5LIB="/mingw64/lib/perl5/site_perl:/c/Strawberry/perl/site/lib:/c/Strawberry/perl/vendor/lib"
        echo "PERL5LIB=$PERL5LIB"
        perl -V
        ln -s /mingw64/bin/mingw32-make /mingw64/bin/make
        which make
    # No compiler masquerade needed: the top-level Makefile wraps both CC and
    # CXX with ccache itself when ccache is on PATH.
    - name: Configure ccache
      run: |
        echo "CCACHE_DIR=/c/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=300M" >> $GITHUB_ENV
        # Compile the original source on a miss, not the preprocessed output.
        # ccache 3.x (what cygwin ships) defaults the other way, and the
        # preprocessor strips the "// fall through" comments that
        # -Wimplicit-fallthrough reads -- with -Werror that is a hard failure.
        # Default in 4.x; set everywhere so the behaviour does not depend on
        # which ccache a platform happens to package.
        echo "CCACHE_CPP2=1" >> $GITHUB_ENV
    - name: Build binaries
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin:/c/Strawberry/perl/bin
        export PERL5LIB="/mingw64/lib/perl5/site_perl:/c/Strawberry/perl/site/lib:/c/Strawberry/perl/vendor/lib"
        hash -r
        mkdir -p bin
        cp `which m4` bin/
        ./build.sh -v -l
    # Hit rate is the only way to tell the cache is working.
    - name: ccache stats
      if: always()
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin
        ccache -s
    - name: Build libraries
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin:/c/Strawberry/perl/bin
        export PERL5LIB="/mingw64/lib/perl5/site_perl:/c/Strawberry/perl/site/lib:/c/Strawberry/perl/vendor/lib"
        hash -r
        MAKE_CONCURRENCY=-j4 ./build.sh -v -b
    - name: Build examples
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin:/c/Strawberry/perl/bin
        export PERL5LIB="/mingw64/lib/perl5/site_perl:/c/Strawberry/perl/site/lib:/c/Strawberry/perl/vendor/lib"
        hash -r
        ./build.sh -v -b -l -e
    - name: Run tests
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin:/c/Strawberry/perl/bin
        export PERL5LIB="/mingw64/lib/perl5/site_perl:/c/Strawberry/perl/site/lib:/c/Strawberry/perl/vendor/lib"
        hash -r
        MAKE_CONCURRENCY=-j4 ./build.sh -v -b -l -t
