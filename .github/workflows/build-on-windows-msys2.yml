name: build-on-windows-msys2
on:
  push:
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      LANG: C
      LC_ALL: C
    steps:
    - name: Configure git
      run: |
        git config --global core.autocrlf input
      shell: cmd
    - name: Checkout from git
      uses: actions/checkout@v5
      with:
        submodules: 'true'
    # C:\ccache rather than ~/.ccache: actions/cache resolves ~ through node,
    # to C:\Users\runneradmin, which is not where the msys2 shell's ~ points.
    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: |
          C:\ccache
        key: ${{ runner.os }}-ccache-msys2-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-ccache-msys2-
    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        # The image already ships MSYS2; a fresh install puts a second copy on
        # D:, which is 14G total and also holds the workspace.
        release: false
        install: >
            base-devel
            git
            m4
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-make
            mingw-w64-x86_64-perl
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-ragel
            re2c
            vim
    - name: Disk after msys2 install
      if: always()
      run: |
        echo '--- free space ---'
        df -h
        echo "TMP=$TMP TEMP=$TEMP"
        echo "stray zcc temp entries: $(find . -maxdepth 5 -name 'zcc*' 2>/dev/null | wc -l)"
        find . -maxdepth 5 -name 'zcc*' 2>/dev/null | head -5
    - name: Install Strawberry Perl
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54201_64bit/strawberry-perl-5.42.0.1-64bit.msi" -OutFile "strawberry.msi"
        Start-Process msiexec.exe -ArgumentList "/i strawberry.msi /quiet /qn /norestart" -Wait
    - name: Install CPAN modules (Strawberry Perl)
      shell: cmd
      run: |
        set PATH=C:\Strawberry\perl\bin;C:\Strawberry\c\bin;%PATH%
        cpanm --notest Archive::Zip Array::Compare CPU::Z80::Assembler Capture::Tiny Clone Data::Dump Data::HexDump File::Path List::Uniq Modern::Perl Object::Tiny Object::Tiny::RW Params::Util Path::Tiny Regexp::Common Spreadsheet::ParseXLSX Test::Harness Test::HexDifferences Test::PureASCII Text::Diff Text::Table Win32::Autoglob YAML::Tiny
    - name: Bootstrap cpanm for MinGW Perl
      shell: msys2 {0}
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin
        curl -L https://raw.githubusercontent.com/miyagawa/cpanminus/master/cpanm -o /mingw64/bin/cpanm
        chmod +x /mingw64/bin/cpanm
        which cpanm
        cpanm --version
    - name: Install XS modules under MinGW Perl
      shell: msys2 {0}
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin
        cpanm --notest Params::Util
    - name: Configure PERL5LIB for MinGW Perl
      shell: msys2 {0}
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin:/c/Strawberry/perl/bin
        export PERL5LIB="/mingw64/lib/perl5/site_perl:/c/Strawberry/perl/site/lib:/c/Strawberry/perl/vendor/lib"
        echo "PERL5LIB=$PERL5LIB"
        perl -V
        ln -s /mingw64/bin/mingw32-make /mingw64/bin/make
        which make
    # ccache goes in by masquerade, not as a "ccache gcc" prefix: the build
    # exports CC/CXX as single words and src/z80asm/tools/build_ldflags.pl
    # takes exactly two arguments. Symlinked by hand because the package's own
    # masquerade directory differs between msys2 and cygwin. Both bare and
    # .exe names, since make searches for either.
    - name: Configure ccache
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin
        mkdir -p /usr/local/ccache-bin
        for c in gcc cc g++ c++; do
          ln -sf "$(command -v ccache)" /usr/local/ccache-bin/$c
          ln -sf "$(command -v ccache)" /usr/local/ccache-bin/$c.exe
        done
        echo "CCACHE_DIR=/c/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=300M" >> $GITHUB_ENV
    - name: Build binaries
      run: |
        export PATH=/usr/local/ccache-bin:/mingw64/bin:/usr/bin:/bin:/c/Strawberry/perl/bin
        export PERL5LIB="/mingw64/lib/perl5/site_perl:/c/Strawberry/perl/site/lib:/c/Strawberry/perl/vendor/lib"
        hash -r
        command -v gcc
        mkdir -p bin
        cp `which m4` bin/
        ./build.sh -v -l
    # Hit rate is the only way to tell the cache is working.
    - name: ccache stats
      if: always()
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin
        ccache -s
    - name: Disk after binaries
      if: always()
      run: |
        echo '--- free space ---'
        df -h
        echo "TMP=$TMP TEMP=$TEMP"
        echo "stray zcc temp entries: $(find . -maxdepth 5 -name 'zcc*' 2>/dev/null | wc -l)"
        find . -maxdepth 5 -name 'zcc*' 2>/dev/null | head -5
    - name: Build libraries
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin:/c/Strawberry/perl/bin
        export PERL5LIB="/mingw64/lib/perl5/site_perl:/c/Strawberry/perl/site/lib:/c/Strawberry/perl/vendor/lib"
        hash -r
        MAKE_CONCURRENCY=-j4 ./build.sh -v -b
    - name: Disk after libraries
      if: always()
      run: |
        echo '--- free space ---'
        df -h
        echo "TMP=$TMP TEMP=$TEMP"
        echo "stray zcc temp entries: $(find . -maxdepth 5 -name 'zcc*' 2>/dev/null | wc -l)"
        find . -maxdepth 5 -name 'zcc*' 2>/dev/null | head -5
        du -sh libsrc bin lib examples test testsuite 2>/dev/null | sort -h
    - name: Build examples
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin:/c/Strawberry/perl/bin
        export PERL5LIB="/mingw64/lib/perl5/site_perl:/c/Strawberry/perl/site/lib:/c/Strawberry/perl/vendor/lib"
        hash -r
        ./build.sh -v -b -l -e
    - name: Disk after examples
      if: always()
      run: |
        echo '--- free space ---'
        df -h
        echo "TMP=$TMP TEMP=$TEMP"
        echo "stray zcc temp entries: $(find . -maxdepth 5 -name 'zcc*' 2>/dev/null | wc -l)"
        find . -maxdepth 5 -name 'zcc*' 2>/dev/null | head -5
        du -sh libsrc bin lib examples test testsuite 2>/dev/null | sort -h
    - name: Run tests
      run: |
        export PATH=/mingw64/bin:/usr/bin:/bin:/c/Strawberry/perl/bin
        export PERL5LIB="/mingw64/lib/perl5/site_perl:/c/Strawberry/perl/site/lib:/c/Strawberry/perl/vendor/lib"
        hash -r
        make -C libsrc install-clean
        echo '--- free space after install-clean ---'
        df -h
        ./build.sh -v -b -l -t
