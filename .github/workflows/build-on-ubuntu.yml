name: build-on-ubuntu

on:
  push:
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout from git
      uses: actions/checkout@v4
      with: 
        submodules: 'true'
    # ccache only defaults to $HOME/.ccache when that directory already exists;
    # on a fresh runner it does not, so ccache was writing to $HOME/.cache/ccache
    # while the workflow cached $HOME/.ccache. Nothing was ever cached -- the
    # entry sat at 1MB. Pin the directory so both agree on it.
    # The 400M ceiling is because this cache is saved on every run now and the
    # repository only gets 10G before GitHub evicts by last-access date, which
    # would take the msys2 package caches with it. ccache's own default is 5G.
    - name: Configure ccache
      run: |
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=400M" >> $GITHUB_ENV

    # Split so the two can age differently, and rolled because actions/cache
    # never overwrites an existing key, so a fixed one is written on the first
    # run and never again -- it cannot even recover from the 7-day eviction.
    # restore-keys falls back to the most recent entry; each run saves a fresh one.
    - name: Cache perl modules
      uses: actions/cache@v4
      with:
        path: |
          ~/perl5
        key: ${{ runner.os }}-perl5-${{ hashFiles('.github/workflows/build-on-ubuntu.yml') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-perl5-${{ hashFiles('.github/workflows/build-on-ubuntu.yml') }}-
          ${{ runner.os }}-perl5-

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-ccache-
    - name: Update apt 
      run: |
        sudo apt update
    - name: Install apt dependencies
      run: |
        sudo apt install -y build-essential bison flex libxml2-dev subversion zlib1g-dev m4 ragel re2c dos2unix texinfo texi2html gdb curl cpanminus ccache libboost-all-dev libmodern-perl-perl libyaml-perl liblocal-lib-perl libcapture-tiny-perl libpath-tiny-perl libtext-table-perl libdata-hexdump-perl libregexp-common-perl libclone-perl libfile-slurp-perl libgmp-dev libspreadsheet-parsexlsx-perl
    - name: Install perl prerequisites
      run: |
        cpanm --local-lib=~/perl5 App::Prove Array::Compare Clone CPU::Z80::Assembler Data::Dump Data::HexDump File::Path List::Uniq Modern::Perl Object::Tiny Object::Tiny::RW Regexp::Common Test::Harness Test::HexDifferences Test::PureASCII Text::Diff Text::Table YAML::Tiny
    - name: Build binaries
      run: |
        eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
        ./build.sh -v -l
    # Hit rate is the only way to tell the cache is actually working; it read
    # 0 for as long as ccache and the cache step disagreed about the directory.
    - name: ccache stats
      if: always()
      run: ccache -s
    - name: Build libraries
      run: |
        eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
        MAKE_CONCURRENCY=-j4 ./build.sh -v -b
    - name: Build examples
      run: |
        eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
        ./build.sh -v -b -l -e
    - name: Build sdcc needed for tests
      run: |
        make BUILD_SDCC=1 BUILD_SDCC_HTTP=1 bin/z88dk-zsdcc
    - name: Run tests
      run: |
        eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
        ./build.sh -v -b -l -t
