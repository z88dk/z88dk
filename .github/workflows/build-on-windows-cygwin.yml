name: build-on-windows-cygwin

on:
  push:
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'doc/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash.exe --login --norc -eo pipefail -o igncr '{0}'
    env:
      SHELLOPTS: igncr
      CHERE_INVOKING: 1
      CYGWIN_NOWINPATH: 1
      
    steps:
    - name: Configure git
      run: |
        git config --global core.autocrlf input
      shell: cmd
      
    - name: Checkout from git
      uses: actions/checkout@v5
      with: 
        submodules: 'true'

    # C:\perl5, not ~/perl5: actions/cache resolves ~ through node, to
    # C:\Users\runneradmin, while cygwin's ~ is /home/runneradmin inside the
    # cygwin root. The cache was watching a directory cpanm never wrote to, so
    # nothing was ever stored and this step cost ~24 minutes every run.
    # Rolled because actions/cache never overwrites an existing key.
    - name: Cache perl modules
      uses: actions/cache@v5
      with:
        path: |
          C:\perl5
        key: ${{ runner.os }}-cygwin-perl5-${{ hashFiles('.github/workflows/build-on-windows-cygwin.yml') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-cygwin-perl5-${{ hashFiles('.github/workflows/build-on-windows-cygwin.yml') }}-
          ${{ runner.os }}-cygwin-perl5-

    # A library build is ~206k short-lived processes, and Defender scans every
    # exec and every object written. Excluding the trees it touches attacks the
    # per-spawn cost, which is what makes cygwin ~9x slower per process than
    # ubuntu on identical work.
    - name: Exclude build trees from Defender
      shell: powershell
      run: |
        foreach ($p in "${{ github.workspace }}", "C:\cygwin", "C:\ccache", "C:\perl5") {
          Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue
        }

    # C:\ccache for the same reason as C:\perl5 above -- ~ resolves to
    # C:\Users\runneradmin here but to the cygwin root's /home in the build.
    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: |
          C:\ccache
        key: ${{ runner.os }}-ccache-cygwin-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-ccache-cygwin-

    - name: Setup Cygwin
      uses: cygwin/cygwin-install-action@v6
      with:
        platform: x64
        packages: >
          autoconf
          automake
          bison
          ccache
          dos2unix
          flex
          gcc-core
          gcc-g++ 
          libcrypt-devel 
          libexpat-devel 
          libgmp-devel
          libiconv-devel 
          liblzma-devel 
          libtool  
          libxml2-devel 
          make 
          perl 
          pkg-config
          ragel 
          unzip 
          wget 
          zlib-devel 
    # The masquerade symlinks are made by hand rather than using the package's
    # own directory, which sits in a different place on cygwin and msys2. The
    # build exports CC/CXX as single words, so a "ccache g++" prefix is not an
    # option -- src/z80asm/tools/build_ldflags.pl takes exactly two arguments.
    # PATH is prepended per step rather than through GITHUB_PATH: that expects
    # Windows-style paths, and CYGWIN_NOWINPATH strips them anyway.
    - name: Configure ccache
      run: |
        mkdir -p /usr/local/ccache-bin
        for c in gcc cc g++ c++; do
          ln -sf "$(command -v ccache)" /usr/local/ccache-bin/$c
          ln -sf "$(command -v ccache)" /usr/local/ccache-bin/$c.exe
        done
        echo "CCACHE_DIR=/cygdrive/c/ccache" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=300M" >> $GITHUB_ENV

    - name: Install choco packages
      run: |
        choco install re2c
      shell: cmd
    - name: Install perl prerequisites
      run: |
        # Standalone cpanm rather than `cpan App::cpanminus`: the CPAN client
        # shells out constantly, which is expensive under cygwin's fork(), and
        # installs outside the cached tree so it was never cached.
        mkdir -p /usr/local/bin
        wget -q https://raw.githubusercontent.com/miyagawa/cpanminus/master/cpanm -O /usr/local/bin/cpanm
        chmod +x /usr/local/bin/cpanm
        which cpanm
        cpanm --version
        cpanm --local-lib=/cygdrive/c/perl5 local::lib
        eval $(perl -I /cygdrive/c/perl5/lib/perl5/ -Mlocal::lib=/cygdrive/c/perl5)
        cpanm --notest Clone XML::Twig Spreadsheet::ParseXLSX
        cpanm App::Prove Array::Compare Capture::Tiny Clone CPU::Z80::Assembler Data::Dump Data::HexDump File::Path List::Uniq Modern::Perl Object::Tiny Object::Tiny::RW Path::Tiny Regexp::Common Spreadsheet::ParseXLSX Test::Harness Test::HexDifferences Test::PureASCII Text::Diff Text::Table YAML::Tiny
        echo "perl5 tree: $(du -sh /cygdrive/c/perl5 2>/dev/null | cut -f1) in $(find /cygdrive/c/perl5 -type f 2>/dev/null | wc -l) files"
        
    - name: Build binaries
      run: |
        eval $(perl -I /cygdrive/c/perl5/lib/perl5/ -Mlocal::lib=/cygdrive/c/perl5)
        export PATH=/usr/local/ccache-bin:$PATH:/cygdrive/c/ProgramData/chocolatey/bin
        command -v gcc
        ./build.sh -v -l

    # Hit rate is the only way to tell the cache is working.
    - name: ccache stats
      if: always()
      run: ccache -s

    - name: Build libraries
      run: |
        eval $(perl -I /cygdrive/c/perl5/lib/perl5/ -Mlocal::lib=/cygdrive/c/perl5)
        export PATH=$PATH:/cygdrive/c/ProgramData/chocolatey/bin
        # Oversubscribed on purpose. The runner has 4 cores, but the work is
        # ~200k short-lived processes and cygwin's fork emulation leaves them
        # blocked in DLL load and file I/O rather than on CPU.
        MAKE_CONCURRENCY=-j8 ./build.sh -v -b

    - name: Build examples
      run: |
        eval $(perl -I /cygdrive/c/perl5/lib/perl5/ -Mlocal::lib=/cygdrive/c/perl5)
        export PATH=$PATH:/cygdrive/c/ProgramData/chocolatey/bin
        ./build.sh -v -b -l -e

    - name: Run tests
      run: |
        eval $(perl -I /cygdrive/c/perl5/lib/perl5/ -Mlocal::lib=/cygdrive/c/perl5)
        export PATH=$PATH:/cygdrive/c/ProgramData/chocolatey/bin
        ./build.sh -v -b -l -t
