name: build-on-windows-cygwin

on:
  push:
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash.exe --login --norc -eo pipefail -o igncr '{0}'
    env:
      SHELLOPTS: igncr
      CHERE_INVOKING: 1
      CYGWIN_NOWINPATH: 1
      
    steps:
    - name: Configure git
      run: |
        git config --global core.autocrlf input
      shell: cmd
      
    - name: Checkout from git
      uses: actions/checkout@v4
      with: 
        submodules: 'true'

    # Rolling key: actions/cache never overwrites an existing key, so a fixed
    # one is written once and then frozen. restore-keys falls back to the most
    # recent entry, and each run saves a fresh one.
    - name: Cache perl modules
      uses: actions/cache@v4
      with:
        path: |
          ~/perl5
        key: ${{ runner.os }}-cygwin-perl5-${{ hashFiles('.github/workflows/build-on-windows-cygwin.yml') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-cygwin-perl5-${{ hashFiles('.github/workflows/build-on-windows-cygwin.yml') }}-
          ${{ runner.os }}-cygwin-perl5-

    - name: Setup Cygwin
      uses: cygwin/cygwin-install-action@master
      with:
        platform: x64
        packages: >
          autoconf 
          automake 
          bison 
          dos2unix 
          flex 
          gcc-core
          gcc-g++ 
          libcrypt-devel 
          libexpat-devel 
          libgmp-devel
          libiconv-devel 
          liblzma-devel 
          libtool  
          libxml2-devel 
          make 
          perl 
          pkg-config
          ragel 
          unzip 
          wget 
          zlib-devel 
    - name: Install choco packages
      run: |
        choco install re2c
      shell: cmd
    - name: Install perl prerequisites
      run: |
        # Bootstrap cpanm from its standalone script rather than
        # `cpan App::cpanminus`. The CPAN client configures itself, resolves a
        # mirror and shells out constantly, which on cygwin -- where every
        # fork() is expensive -- dominated this step. It also installs into the
        # system perl, outside the ~/perl5 cache, so it was paid in full every
        # run. Same approach the msys2 workflow already uses.
        mkdir -p /usr/local/bin
        curl -L https://raw.githubusercontent.com/miyagawa/cpanminus/master/cpanm -o /usr/local/bin/cpanm
        chmod +x /usr/local/bin/cpanm
        which cpanm
        cpanm --version
        cpanm --local-lib=~/perl5 local::lib
        eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
        cpanm --notest Clone XML::Twig Spreadsheet::ParseXLSX
        cpanm App::Prove Array::Compare Capture::Tiny Clone CPU::Z80::Assembler Data::Dump Data::HexDump File::Path List::Uniq Modern::Perl Object::Tiny Object::Tiny::RW Path::Tiny Regexp::Common Spreadsheet::ParseXLSX Test::Harness Test::HexDifferences Test::PureASCII Text::Diff Text::Table YAML::Tiny
        
    - name: Build binaries
      run: |
        eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
        export PATH=$PATH:/cygdrive/c/ProgramData/chocolatey/bin
        ./build.sh -v -l

    - name: Build libraries
      run: |
        eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
        export PATH=$PATH:/cygdrive/c/ProgramData/chocolatey/bin
        MAKE_CONCURRENCY=-j4 ./build.sh -v -b

    - name: Build examples
      run: |
        eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
        export PATH=$PATH:/cygdrive/c/ProgramData/chocolatey/bin
        ./build.sh -v -b -l -e

    - name: Run tests
      run: |
        eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
        export PATH=$PATH:/cygdrive/c/ProgramData/chocolatey/bin
        ./build.sh -v -b -l -t
